<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>도시에서 태어나기</title>
<meta name="description" content="도시의 동물로 랜덤하게 태어나, 주택가와 도심과 공원 사이에서 끝까지 살아남는 선택형 게임.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="app">
  <canvas id="stage" aria-hidden="true"></canvas>
  <header class="hud" id="hud" hidden>
    <div class="tag who"><b id="spName"></b><small id="spLatin"></small><span id="age"></span></div>
    <div class="tag vitals">
      <div class="vrow"><span>체력</span><span class="seg hp" id="hpBar"></span><span class="num" id="hpNum"></span></div>
      <div class="vrow"><span>포만</span><span class="seg food" id="foodBar"></span><span class="num" id="foodNum"></span></div>
      <div class="kids" id="kids"></div>
    </div>
    <div class="scale"><i id="scaleBar"></i><span id="scaleLabel"></span></div>
  </header>
  <div class="roulette" id="roulette" hidden aria-live="polite"></div>
  <div class="caption" id="caption" hidden><span class="tc" id="capTc"></span><span class="tx" id="capTx"></span></div>
  <section class="deck" id="deck" hidden aria-live="polite">
    <div class="card-wrap" id="cardWrap">
      <div class="card">
        <div class="hint l" id="hintL"></div><div class="hint r" id="hintR"></div>
        <div class="card-body" id="cardBody"></div>
      </div>
    </div>
    <div class="picks" id="picks"></div>
  </section>
</main>

<script src="js/core/color.js"></script>
<script src="js/core/engine.js"></script>
<script src="js/data/scenes.js"></script>
<script src="js/data/registry.js"></script>
<script src="js/data/species/cat.js"></script>
<script src="js/data/species/cockroach.js"></script>
<script src="js/data/species/pigeon.js"></script>
<script src="js/data/species/fly.js"></script>
<script src="js/render/paper.js"></script>
<script src="js/render/items-outdoor.js"></script>
<script src="js/render/items-indoor.js"></script>
<script src="js/render/animals.js"></script>
<script src="js/render/backdrop.js"></script>
<script src="js/render/scene.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
