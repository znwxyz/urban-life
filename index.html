<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>도시에서 태어나기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
:root{
  /* Layout: full-bleed side-view stage on canvas + nature-documentary lower thirds. HUD on top, decision sheet at bottom. Single dark "night street" look by choice. */
  --night:#0e1315;
  --panel:rgba(15,21,23,.9);
  --ink:#efe9dc;
  --dim:#98a29b;
  --line:rgba(239,233,220,.16);
  --sodium:#f2a03d;   /* streetlamp orange: tracker, primary actions */
  --life:#86c48f;
  --harm:#ea6450;
  --food:#e2c35c;
  --f-display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--f-body);overflow:hidden}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
.app{position:relative;height:100%;overflow:hidden}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block}

.hud{position:absolute;top:0;left:0;right:0;padding:12px 16px 34px;display:grid;grid-template-columns:1fr auto;gap:8px 20px;
  background:linear-gradient(rgba(9,13,14,.82),rgba(9,13,14,0));pointer-events:none}
.who .sp{font-family:var(--f-display);font-size:24px;line-height:1.1}
.who .latin{font-family:var(--f-mono);font-size:11px;color:var(--dim);font-style:italic;margin-top:2px}
.vitals{display:flex;flex-direction:column;gap:5px;align-items:flex-end;min-width:0}
.meter{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim)}
.meter i{display:block;width:96px;height:6px;background:rgba(239,233,220,.14);border-radius:3px;overflow:hidden}
.meter b{display:block;height:100%;transform-origin:left;transition:transform .5s ease}
#hpBar{background:var(--life)} #foodBar{background:var(--food)}
.kids{font-family:var(--f-mono);font-size:11px;color:var(--dim)}
.life{grid-column:1/-1;display:flex;flex-direction:column;gap:5px}
.life-row{display:flex;justify-content:space-between;gap:12px;font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}
.life-row #age{color:var(--ink)} .life-row #target{color:var(--dim)}
.track{height:3px;background:rgba(239,233,220,.14)}
.track b{display:block;height:100%;background:var(--sodium);transform-origin:left;transition:transform .6s ease}
.scale{grid-column:1/-1;display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:11px;color:var(--dim)}
.scale i{display:block;height:6px;border:1.5px solid var(--ink);border-top:0;transition:width .4s ease}
.scale .proto{margin-left:auto;opacity:.7}

.caption{position:absolute;left:16px;bottom:20px;right:16px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.caption .tc{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:var(--sodium);background:rgba(9,13,14,.75);padding:3px 8px}
.caption .tx{font-size:17px;font-weight:500;background:rgba(9,13,14,.75);padding:5px 10px;max-width:60ch}

.sheet{position:absolute;left:16px;right:16px;bottom:16px;margin-inline:auto;max-width:560px;max-height:calc(100% - 150px);overflow:auto;
  background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px 18px 16px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  animation:rise .35s cubic-bezier(.16,1,.3,1)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:var(--sodium)}
.sheet h2{font-family:var(--f-display);font-weight:400;font-size:clamp(24px,5vw,30px);line-height:1.2;margin:6px 0 10px;text-wrap:balance}
.sheet p{line-height:1.7;margin:0 0 14px;max-width:60ch}
.sheet .result{font-size:18px;line-height:1.6}
.sheet .muted{color:var(--dim);font-size:13px}
.specs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px;margin:0 0 16px;padding:12px 0;border-block:1px solid var(--line)}
.specs dt{font-size:11px;color:var(--dim)} .specs dd{margin:2px 0 0;font-family:var(--f-mono);font-size:14px}
.choices{display:grid;gap:8px}
.choice{display:flex;gap:12px;align-items:baseline;width:100%;text-align:left;padding:12px 14px;background:rgba(239,233,220,.05);
  border:1px solid var(--line);border-radius:4px;color:var(--ink);font:inherit;font-size:15px;cursor:pointer;transition:background .15s,border-color .15s,transform .1s}
.choice:hover{background:rgba(242,160,61,.12);border-color:var(--sodium)}
.choice:active{transform:translateY(1px)}
.choice .k{font-family:var(--f-mono);font-size:12px;color:var(--sodium)}
.primary{appearance:none;border:0;border-radius:4px;background:var(--sodium);color:#1b1306;font:600 15px var(--f-body);padding:12px 18px;cursor:pointer;transition:filter .15s,transform .1s}
.primary:hover{filter:brightness(1.08)} .primary:active{transform:translateY(1px)}
.ghost{appearance:none;background:transparent;border:1px solid var(--line);border-radius:4px;color:var(--ink);font:500 13px var(--f-body);padding:8px 12px;cursor:pointer}
.ghost:hover{border-color:var(--sodium)}
button:focus-visible{outline:2px solid var(--sodium);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
.chip{font-family:var(--f-mono);font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid currentColor;font-variant-numeric:tabular-nums}
.chip.up{color:var(--life)} .chip.down{color:var(--harm)} .chip.kid{color:var(--food)}
.roulette{font-family:var(--f-display);font-size:clamp(34px,8vw,46px);margin:8px 0 6px;color:var(--sodium)}
.log{list-style:none;margin:0 0 16px;padding:0;display:flex;flex-direction:column;gap:8px;font-size:13px}
.log li{display:grid;grid-template-columns:7.5em minmax(0,1fr);gap:10px}
.log .when{font-family:var(--f-mono);color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums}
.log .bad{color:var(--harm)}
.verdict{font-family:var(--f-mono);font-size:13px;color:var(--dim);margin:-4px 0 14px}
.verdict strong{color:var(--ink);font-size:22px;font-weight:500}
@media (max-width:480px){.meter i{width:72px}.who .sp{font-size:20px}.caption .tx{font-size:15px}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.meter b,.track b,.scale i{transition:none}}
</style>

<main class="app">
  <canvas id="stage" aria-hidden="true"></canvas>
  <header class="hud" id="hud" hidden>
    <div class="who"><div class="sp" id="spName"></div><div class="latin" id="spLatin"></div></div>
    <div class="vitals">
      <div class="meter"><span>체력</span><i><b id="hpBar"></b></i></div>
      <div class="meter"><span>포만</span><i><b id="foodBar"></b></i></div>
      <div class="kids" id="kids"></div>
    </div>
    <div class="life">
      <div class="life-row"><span id="age"></span><span id="target"></span></div>
      <div class="track"><b id="lifeBar"></b></div>
    </div>
    <div class="scale"><i id="scaleBar"></i><span id="scaleLabel"></span><span class="proto">프로토타입 · 임시 그래픽</span></div>
  </header>
  <div class="caption" id="caption" hidden><span class="tc" id="capTc"></span><span class="tx" id="capTx"></span></div>
  <section class="sheet" id="sheet" aria-live="polite"></section>
</main>

<script>
/* ───────── 상수 ───────── */
const TAU = Math.PI * 2;
const MOVE_MS = 2600, MOVE_MS_REDUCED = 700, FADE_S = 0.45;
const START_HP = 100, START_FOOD = 65, STARVE_DMG = 18, REGEN = 6, FULL_AT = 60;
const RECENT_LIMIT = 5, SCALE_TARGET_PX = 90;
const SCALE_STEPS = [0.5, 1, 2, 5, 10, 20, 50, 100, 200, 500, 1000, 2000];
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ───────── 동물 데이터 ───────── */
const SPECIES = {
  fly: {
    name: '집파리', latin: 'Musca domestica', size: '0.7cm', viewCm: 36, eye: 2.5, speedCm: 8,
    turnDays: 2, targetDays: 30, startMonth: 7, decay: 14, winterDecay: 0, curve: 4, kidUnit: '알',
    box: [-0.5, -3.3, 0.6, -1.9],
    birth: { zone: 'sewer', place: '하수구', title: '하수구에서 깨어났다',
      text: '맨홀 아래 축축한 오물 속, 번데기 껍질을 찢고 나왔다. 날개가 마를 때까지 한 시간. 집파리의 한살이는 길어야 한 달이다.' },
    events: [
      { zone: 'sewer', title: '맨홀 틈의 빛', text: '머리 위 철망 사이로 빛줄기가 내려온다. 음식 냄새가 섞인 바람이 분다.', choices: [
        { t: '빛을 향해 올라간다', p: .12, ok: { food: 8, msg: '골목으로 나왔다. 냄새가 사방에서 몰려온다.' }, bad: { hp: -25, msg: '철망에 걸린 거미줄을 스쳤다. 다리 하나가 끈적하다.' } },
        { t: '하수구에 더 머문다', ok: { food: 20, hp: -6, msg: '오물은 넉넉하지만 가스가 독하다.' } } ] },
      { zone: 'alley', title: '찢어진 음식물 봉투', text: '고양이가 뜯어 놓은 음식물 봉투에서 단 냄새가 진동한다. 멀리서 수거차 후진 경고음이 들린다.', choices: [
        { t: '봉투 깊숙이 파고든다', p: .2, ok: { food: 45, msg: '썩은 수박 껍질. 이 정도면 며칠은 버틴다.' }, bad: { death: true, msg: '수거차가 봉투째 들어 올렸다. 압착기가 닫혔다.', cause: '쓰레기 수거차' } },
        { t: '가장자리만 핥는다', ok: { food: 18, msg: '흘러나온 국물만 조금. 배는 덜 찼지만 날개는 자유롭다.' } } ] },
      { zone: 'kitchen', title: '열린 주방 창문', text: '분식집 뒤편 창문이 반쯤 열려 있다. 튀김기름 냄새, 그리고 사람 목소리.', choices: [
        { t: '주방으로 들어간다', p: .35, ok: { food: 40, msg: '떡볶이 접시 가장자리에 앉았다. 아무도 보지 못했다.' }, bad: { hp: -55, msg: '"파리다!" 접힌 신문지가 날아왔다. 날개 끝이 찢겼다.', cause: '신문지' } },
        { t: '창틀에서 기다린다', ok: { food: 10, msg: '창틀 기름때를 핥으며 시간을 보냈다.' } } ] },
      { zone: 'kitchen', night: true, glow: '#5fa8ff', title: '파란 불빛', text: '천장 구석에서 파란 형광관이 윙윙 운다. 이상하게 끌린다.', choices: [
        { t: '가까이 가 본다', p: .65, ok: { hp: -5, msg: '철망 바로 앞에서 방향을 틀었다. 옆에서 타닥, 다른 파리가 떨어졌다.' }, bad: { death: true, msg: '타닥.', cause: '전기 해충퇴치기' } },
        { t: '어두운 벽으로 피한다', ok: { hp: 8, msg: '벽 모서리에 붙어 밤을 넘겼다.' } } ] },
      { zone: 'alley', title: '처마 밑 거미줄', text: '지름길인 처마 밑에 거미줄이 햇빛에 언뜻 보인다. 돌아가면 한참 걸린다.', choices: [
        { t: '빠르게 통과한다', p: .3, ok: { food: 5, msg: '실 한 가닥이 다리에 닿았지만 끊어냈다.' }, bad: { death: true, msg: '날개가 실에 붙었다. 줄이 떨린다. 주인이 내려온다.', cause: '거미' } },
        { t: '멀리 돌아간다', ok: { food: -12, msg: '지쳤지만 살았다.' } } ] },
      { zone: 'street', weather: 'rain', title: '소나기', text: '하늘이 갑자기 어두워졌다. 빗방울 하나가 내 몸무게보다 몇 배는 무겁다.', choices: [
        { t: '처마 밑에 숨는다', ok: { food: -6, msg: '비가 그칠 때까지 꼼짝 않았다.' } },
        { t: '빗속을 뚫고 간다', p: .4, ok: { food: 15, msg: '빗방울 사이로 빠져나가 쓰레기장에 먼저 닿았다.' }, bad: { hp: -45, msg: '빗방울에 맞아 바닥에 처박혔다. 날개가 젖었다.', cause: '빗방울' } } ] },
      { zone: 'park', title: '갓 싼 개똥', text: '산책로 옆 풀밭. 아직 따뜻하다. 알을 낳기 좋은 곳이다.', choices: [
        { t: '알을 낳는다', ok: { kids: 120, hp: -10, food: -5, msg: '알 120개. 하루면 구더기가 된다.' } },
        { t: '먹기만 한다', ok: { food: 25, msg: '단백질 보충.' } } ] },
      { zone: 'plaza', title: '휘두르는 손', text: '벤치에서 김밥을 먹는 사람. 손이 계속 나를 쫓는다.', choices: [
        { t: '한 번 더 앉아 본다', p: .3, ok: { food: 30, msg: '세 번째 시도에 밥알 하나를 챙겼다.' }, bad: { hp: -60, msg: '손바닥이 스쳤다. 바닥을 굴렀다.', cause: '손바닥' } },
        { t: '포기하고 날아간다', ok: { food: -4, msg: '다른 냄새를 찾아 떠났다.' } } ] },
      { zone: 'kitchen', title: '달콤한 노란 띠', text: '천장에 노란 리본이 매달려 있다. 꿀 냄새가 난다. 동료 몇이 이미 붙어 있다.', choices: [
        { t: '냄새를 따라간다', p: .7, ok: { food: 10, msg: '끈끈한 표면 바로 위에서 정신이 들었다.' }, bad: { death: true, msg: '발이 붙었다. 버둥댈수록 날개도 붙는다.', cause: '끈끈이 트랩' } },
        { t: '그냥 지나친다', ok: { food: -5, msg: '꿀 냄새가 오래 따라왔다.' } } ] },
      { zone: 'street', night: true, title: '실외기의 열기', text: '밤공기가 차다. 식당 에어컨 실외기가 따뜻한 바람을 내뿜는다.', choices: [
        { t: '실외기 위에서 쉰다', ok: { hp: 15, food: -3, msg: '날개 근육이 데워졌다.' } },
        { t: '밤에도 먹이를 찾는다', p: .25, ok: { food: 22, msg: '편의점 앞에 흘린 커피 한 방울.' }, bad: { death: true, msg: '가로등 불빛 아래, 집박쥐가 지나갔다.', cause: '집박쥐' } } ] },
    ],
  },

  pigeon: {
    name: '집비둘기', latin: 'Columba livia', size: '32cm', viewCm: 900, eye: 200, speedCm: 160,
    turnDays: 60, targetDays: 1095, startMonth: 4, decay: 16, winterDecay: 10, curve: 2.5, kidUnit: '새끼',
    box: [-32, -216, 26, -184],
    birth: { zone: 'bridge', place: '교각 틈', title: '교각 틈의 둥지',

    events: [
      { zone: 'plaza', title: '모이 주는 할머니', text: '광장 벤치에서 할머니가 쌀을 한 줌씩 뿌린다. 서른 마리가 몰려든다.', choices: [
        { t: '무리 한가운데로', p: .15, ok: { food: 40, msg: '부리로 밀치며 배를 채웠다.' }, bad: { hp: -15, food: 20, msg: '아이가 무리 속으로 뛰어들었다. 날개를 밟혔다.' } },
        { t: '바깥에서 흘린 것만', ok: { food: 18, msg: '느리지만 안전하다.' } } ] },
      { zone: 'street', title: '실외기 위 가시', text: '작년 둥지 자리였던 실외기 위에 퇴치용 스파이크가 박혔다.', choices: [
        { t: '가시 사이 틈에 둥지를 튼다', p: .3, ok: { hp: 5, msg: '좁지만 비는 피한다.' }, bad: { hp: -30, msg: '가시에 가슴 깃털이 찢겼다.', cause: '퇴치 스파이크' } },
        { t: '새 자리를 찾아 떠난다', ok: { food: -15, msg: '사흘을 헤맨 끝에 다리 밑 빈 틈을 찾았다.' } } ] },
      { zone: 'street', title: '하늘을 비추는 유리', text: '새로 지은 오피스 빌딩. 통유리에 하늘과 구름이 그대로 비친다.', choices: [
        { t: '곧장 날아간다', p: .28, ok: { food: 5, msg: '유리 앞에서 기류가 꺾이는 걸 느끼고 비켜 올랐다.' }, bad: { hp: -70, msg: '쿵. 하늘인 줄 알았다.', cause: '유리창 충돌' } },
        { t: '낮게 돌아간다', ok: { food: -8, msg: '먼 길이었지만 무사하다.' } } ] },
      { zone: 'plaza', title: '맹금류의 그림자', text: '광장 위로 큰 그림자가 원을 그린다. 빌딩 꼭대기에 사는 송골매다.', choices: [
        { t: '무리 속에 섞인다', p: .12, ok: { msg: '무리가 한꺼번에 솟구쳤다. 매는 다른 녀석을 골랐다.' }, bad: { death: true, msg: '무리 밖으로 밀려났다.', cause: '송골매' } },
        { t: '혼자 처마 밑으로 숨는다', p: .25, ok: { food: -5, msg: '처마 밑에서 숨죽였다.' }, bad: { hp: -40, msg: '급강하하던 매의 발톱이 등을 긁었다.', cause: '송골매' } } ] },
      { zone: 'street', title: '발가락의 실', text: '어제부터 발가락에 낚싯줄이 감겨 있다. 점점 조인다.', choices: [
        { t: '부리로 계속 쫀다', p: .5, ok: { hp: -5, msg: '한참 만에 풀렸다.' }, bad: { hp: -25, msg: '풀지 못했다. 발가락 하나가 말라 떨어졌다.', cause: '감긴 낚싯줄' } },

/* ───────── 시간·계절 ───────── */
function durLabel(d) {
  if (d < 60) return `${d}일`;
  const m = Math.round(d / 30.4), y = Math.floor(m / 12), mm = m % 12;
  if (!y) return `${m}개월`;
  return mm ? `${y}년 ${mm}개월` : `${y}년`;
}
const monthOf = (sp, d) => ((sp.startMonth - 1 + Math.floor(d / 30.4)) % 12) + 1;
function seasonOf(m) { if (m >= 3 && m <= 5) return 'spring'; if (m >= 6 && m <= 8) return 'summer'; if (m >= 9 && m <= 11) return 'autumn'; return 'winter'; }
const SEASON_KO = { spring: '봄', summer: '여름', autumn: '가을', winter: '겨울' };
const seasonOk = (season, m) => !season || seasonOf(m) === season;

/* ───────── 게임 상태 ───────── */
let game = { phase: 'idle', spKey: null };
const view = { zone: 'street', night: false, glow: null, weather: null, camX: 5000, speed: 0, fade: 0, t: 0 };
let moveTimer = null, rouletteTimer = null;

const newGame = (spKey) => ({ phase: 'birth', spKey, day: 0, hp: START_HP, food: START_FOOD, kids: 0, log: [], recent: [], eventIdx: null, outcome: null, dead: false, won: false, cause: null });

function pickEventIdx(sp, g) {
  const m = monthOf(sp, g.day);
  const all = sp.events.map((e, i) => ({ e, i })).filter(({ e }) => seasonOk(e.season, m));
  const fresh = all.filter(({ i }) => !g.recent.includes(i));
  const pool = fresh.length ? fresh : all;
  const seasonal = pool.filter(({ e }) => e.season);
  const list = seasonal.length && Math.random() < .6 ? seasonal : pool;
  return list[Math.floor(Math.random() * list.length)].i;
}

function resolve(g, choice) {
  const sp = SPECIES[g.spKey];
  const isBad = Boolean(choice.bad) && Math.random() < (choice.p || 0);
  const out = isBad ? choice.bad : choice.ok;
  const winter = seasonOf(monthOf(sp, g.day)) === 'winter';
  const decay = sp.decay + (winter ? sp.winterDecay : 0);
  const food = clamp(g.food + (out.food || 0) - decay, 0, 100);
  const starving = food === 0;
  const regen = !isBad && food >= FULL_AT ? REGEN : 0;
  const hp = clamp(g.hp + (out.hp || 0) - (starving ? STARVE_DMG : 0) + regen, 0, 100);
  const dead = Boolean(out.death) || hp <= 0;
  const cause = dead ? (out.cause || (starving ? '굶주림' : '쇠약')) : null;
  const day = dead ? g.day + Math.max(1, Math.round(sp.turnDays * Math.random())) : g.day + sp.turnDays;
  const won = !dead && day >= sp.targetDays;
  const kids = g.kids + (out.kids || 0);
  const ev = sp.events[g.eventIdx];
  const entry = { when: durLabel(g.day), title: ev.title, choice: choice.t, bad: isBad || dead };
  return {
    ...g, phase: 'outcome', hp, food, kids, day: won ? sp.targetDays : day, dead, won, cause,
    log: [...g.log, entry],
    outcome: { choice: choice.t, msg: out.msg || (dead ? `${cause}.` : '별일 없었다.'), dHp: hp - g.hp, dFood: food - g.food, kids: out.kids || 0, starving, decayed: decay, isBad },
  };
}

const percentile = (sp, day) => { const f = Math.min(day / sp.targetDays, 1); return clamp(Math.round(100 * (1 - Math.pow(1 - f, sp.curve))), 1, 99); };

/* ───────── DOM ───────── */
const $ = (id) => document.getElementById(id);
const sheet = $('sheet');
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  Object.entries(props || {}).forEach(([k, v]) => {
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v);
  });
  kids.flat().forEach((k) => { if (k != null && k !== false) el.append(k instanceof Node ? k : document.createTextNode(String(k))); });
  return el;
}
function showSheet(...nodes) {
  sheet.hidden = false; sheet.replaceChildren(...nodes);
  sheet.style.animation = 'none'; void sheet.offsetWidth; sheet.style.animation = '';
  sheet.scrollTop = 0;
  const first = sheet.querySelector('button'); if (first) first.focus({ preventScroll: true });
}
const hideSheet = () => { sheet.hidden = true; sheet.replaceChildren(); };

function updateHud() {
  const sp = SPECIES[game.spKey];
  $('hud').hidden = !sp; if (!sp) return;
  $('spName').textContent = sp.name; $('spLatin').textContent = `${sp.latin} · ${sp.size}`;
  $('hpBar').style.transform = `scaleX(${game.hp / 100})`;
  $('foodBar').style.transform = `scaleX(${game.food / 100})`;
  $('kids').textContent = game.kids ? `남긴 ${sp.kidUnit} ${game.kids}` : '';
  const season = SEASON_KO[seasonOf(monthOf(sp, game.day))];
  $('age').textContent = `생후 ${durLabel(game.day)} · ${season}`;
  $('target').textContent = `목표 ${durLabel(sp.targetDays)}`;
  $('lifeBar').style.transform = `scaleX(${Math.min(game.day / sp.targetDays, 1)})`;
}
let lastScaleS = 0;
function updateScaleBar(s) {
  if (Math.abs(s - lastScaleS) < 1e-6) return; lastScaleS = s;
  const best = SCALE_STEPS.reduce((a, b) => (Math.abs(Math.log(b * s / SCALE_TARGET_PX)) < Math.abs(Math.log(a * s / SCALE_TARGET_PX)) ? b : a));
  $('scaleBar').style.width = `${best * s}px`;
  $('scaleLabel').textContent = best >= 100 ? `${best / 100} m` : `${best} cm`;
}

/* ───────── 화면 흐름 ───────── */
function setZone(zone, opts = {}) {
  if (zone !== view.zone) { view.fade = 1; view.camX = 2000 + Math.random() * 90000; }
  Object.assign(view, { zone, night: Boolean(opts.night), glow: opts.glow || null, weather: opts.weather || null });
}

function startRoulette(forcedKey) {
  clearTimeout(moveTimer); clearInterval(rouletteTimer);
  game = { phase: 'idle', spKey: null }; updateHud();
  $('caption').hidden = true;
  setZone(['street', 'alley', 'park'][Math.floor(Math.random() * 3)]);
  const key = forcedKey || SPECIES_KEYS[Math.floor(Math.random() * SPECIES_KEYS.length)];
  const name = h('div', { class: 'roulette' }, '…');
  showSheet(h('div', { class: 'eyebrow' }, '도시에서 태어나기'), name, h('p', { class: 'muted' }, '무엇으로 태어날지는 고를 수 없다.'));
  if (reducedMotion) { revealBirth(key); return; }
  let n = 0;
  rouletteTimer = setInterval(() => {
    name.textContent = SPECIES[SPECIES_KEYS[n % SPECIES_KEYS.length]].name; n += 1;
    if (n > 14) { clearInterval(rouletteTimer); revealBirth(key); }
  }, 80);
}

function revealBirth(key) {
  const sp = SPECIES[key];
  game = newGame(key); updateHud();
  setZone(sp.birth.zone);
  const spec = (k, v) => h('div', null, h('dt', null, k), h('dd', null, v));
  showSheet(
    h('div', { class: 'eyebrow' }, `${sp.birth.place} · ${sp.latin}`),
    h('h2', null, `${sp.name}로 태어났다`),
    h('p', null, sp.birth.text),
    h('dl', { class: 'specs' }, spec('몸길이', sp.size), spec('목표 생존', durLabel(sp.targetDays)), spec('한 장면', `${sp.turnDays}일`), spec('눈높이', `${sp.eye}cm`)),
    h('div', { class: 'row' }, h('button', { class: 'primary', onclick: nextTurn }, '살아 보기')),
  );
}

function nextTurn() {
  const sp = SPECIES[game.spKey];
  const idx = pickEventIdx(sp, game);
  const ev = sp.events[idx];
  game = { ...game, phase: 'move', eventIdx: idx, recent: [...game.recent, idx].slice(-RECENT_LIMIT) };
  const outdoor = Boolean(ZONES[ev.zone].sky);
  const snow = outdoor && seasonOf(monthOf(sp, game.day)) === 'winter';
  setZone(ev.zone, { night: ev.night, glow: ev.glow, weather: ev.weather || (snow ? 'snow' : null) });
  hideSheet(); updateHud();
  $('capTc').textContent = `생후 ${durLabel(game.day)} · ${SEASON_KO[seasonOf(monthOf(sp, game.day))]}${ev.night ? ' · 밤' : ''}`;
  $('capTx').textContent = ZONES[ev.zone].name;
  $('caption').hidden = false;
  moveTimer = setTimeout(showChoice, reducedMotion ? MOVE_MS_REDUCED : MOVE_MS);
}

function showChoice() {
  const sp = SPECIES[game.spKey];
  const ev = sp.events[game.eventIdx];
  game = { ...game, phase: 'choice' };
  $('caption').hidden = true;
  showSheet(
    h('div', { class: 'eyebrow' }, `생후 ${durLabel(game.day)} · ${ZONES[ev.zone].name}`),
    h('h2', null, ev.title),
    h('p', null, ev.text),
    h('div', { class: 'choices' }, ev.choices.map((c, i) => h('button', { class: 'choice', onclick: () => choose(i) }, h('span', { class: 'k' }, String(i + 1)), h('span', null, c.t)))),
  );
}

function choose(i) {
  if (game.phase !== 'choice') return;
  const ev = SPECIES[game.spKey].events[game.eventIdx];
  game = resolve(game, ev.choices[i]);
  updateHud(); showOutcome();
}

function deltaChip(label, d) { if (!d) return null; return h('span', { class: `chip ${d > 0 ? 'up' : 'down'}` }, `${label} ${d > 0 ? '+' : '−'}${Math.abs(d)}`); }

function showOutcome() {
  const sp = SPECIES[game.spKey], o = game.outcome;
  const ended = game.dead || game.won;
  showSheet(
    h('div', { class: 'eyebrow' }, `선택 · ${o.choice}`),
    h('p', { class: 'result' }, o.msg),
    game.won ? h('p', null, `${durLabel(sp.targetDays)}을 다 살았다. ${sp.name}로서는 천수다.`) : null,
    game.dead ? h('h2', null, '여기까지였다') : null,
    h('div', { class: 'chips' },
      deltaChip('체력', o.dHp), deltaChip('포만', o.dFood),
      o.kids ? h('span', { class: 'chip kid' }, `${sp.kidUnit} +${o.kids}`) : null,
      o.starving ? h('span', { class: 'chip down' }, '굶주림') : null),
    !ended ? h('p', { class: 'muted' }, `${sp.turnDays}일이 지난다. 시간이 갈수록 배가 고프다 (포만 −${o.decayed}).`) : null,
    h('div', { class: 'row' }, h('button', { class: 'primary', onclick: ended ? showEnd : nextTurn }, ended ? '생애 기록 보기' : '계속 살아가기')),
  );
}

function showEnd() {
  const sp = SPECIES[game.spKey];
  const pct = percentile(sp, game.day);
  game = { ...game, phase: 'end' };
  setZone(view.zone, { night: true });
  showSheet(
    h('div', { class: 'eyebrow' }, `생애 기록 · ${sp.name}`),
    h('h2', null, game.won ? '천수를 누렸다' : `생후 ${durLabel(game.day)}, ${game.cause}`),
    h('p', { class: 'verdict' }, h('strong', null, `${pct}`), ` / 100 · 같은 해 도시에서 태어난 ${sp.name} 100마리 중 ${pct}마리보다 오래 살았다 (게임 속 가상 수치)`),
    h('dl', { class: 'specs' },
      h('div', null, h('dt', null, '산 기간'), h('dd', null, `${durLabel(game.day)} / ${durLabel(sp.targetDays)}`)),
      h('div', null, h('dt', null, `남긴 ${sp.kidUnit}`), h('dd', null, String(game.kids)))),
    h('ol', { class: 'log' }, game.log.map((e) => h('li', null, h('span', { class: 'when' }, e.when), h('span', { class: e.bad ? 'bad' : '' }, `${e.title} → ${e.choice}`)))),
    h('div', { class: 'row' },
      h('button', { class: 'primary', onclick: () => startRoulette() }, '다시 태어나기'),
      SPECIES_KEYS.map((k) => h('button', { class: 'ghost', onclick: () => startRoulette(k) }, `${SPECIES[k].name}로`))),
  );
}

document.addEventListener('keydown', (e) => {
  if (game.phase !== 'choice') return;
  const n = Number(e.key);
  const ev = SPECIES[game.spKey].events[game.eventIdx];
  if (n >= 1 && n <= ev.choices.length) choose(n - 1);
});

/* ───────── 렌더링 ───────── */
let W = 0, H = 0;
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = canvas.clientWidth; H = canvas.clientHeight;
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener('resize', resize);

const particles = Array.from({ length: 140 }, () => ({ x: Math.random(), y: Math.random(), v: .6 + Math.random() * .6 }));

function drawFar(z, s, g) {
  if (!z.far) return;
  const fs = Math.min(s, .35) * .6, off = view.camX * fs * .5;
  ctx.fillStyle = z.far;
  if (z.mountain) {
    ctx.beginPath(); ctx.moveTo(0, g);
    for (let x = 0; x <= W + 8; x += 8) ctx.lineTo(x, g - fs * (1800 + 700 * Math.sin((x + off) / 260) + 400 * Math.sin((x + off) / 97)));
    ctx.lineTo(W, g); ctx.closePath(); ctx.fill(); return;
  }
  const cell = 700 * fs, i0 = Math.floor(off / cell) - 1, i1 = Math.floor((off + W) / cell) + 1;
  for (let i = i0; i <= i1; i++) { const bh = (1500 + hash(i, 5) * 4500) * fs; ctx.fillRect(i * cell - off, g - bh, cell * .92, bh); }
}

function drawWall(z, s, g) {
  const w = z.wall; if (!w) return;
  const top = Math.max(w.h ? g - w.h * s : 0, 0);
  R(0, top, W, g - top, w.color);
  const x0 = view.camX;
  if ((w.brick && s > 1.2) || (w.tile && s > .8)) {
    const bw = w.tile ? 15 : 22, bh = w.tile ? 15 : 7.5;
    const rows = Math.min(Math.ceil((g - top) / (bh * s)), 300);
    ctx.strokeStyle = w.tile ? 'rgba(120,110,85,.35)' : 'rgba(0,0,0,.28)'; ctx.lineWidth = 1; ctx.beginPath();
    for (let r = 0; r <= rows; r++) {
      const y = g - r * bh * s; ctx.moveTo(0, y); ctx.lineTo(W, y);
      const shift = w.tile ? 0 : (r % 2) * bw / 2;
      for (let i = Math.floor((x0 - shift) / bw); (i * bw + shift - x0) * s < W; i++) { const x = (i * bw + shift - x0) * s; ctx.moveTo(x, y); ctx.lineTo(x, y - bh * s); }
    }
    ctx.stroke();
  }
  if (!w.windows) return;
  const gap = 320, i0 = Math.floor(x0 / gap) - 1, i1 = Math.floor((x0 + W / s) / gap) + 1;
  if (i1 - i0 > 200) return;
  const floors = Math.floor((w.h - 150) / 300);
  for (let i = i0; i <= i1; i++) {
    const x = (i * gap + 95 - x0) * s;
    for (let f = 0; f < floors; f++) {
      const y = g - (260 + f * 300) * s; if (y > g || y + 150 * s < 0) continue;
      const lit = view.night && hash(i * 31 + f, 9) < .35;
      R(x, y, 130 * s, 150 * s, lit ? '#f2c46d' : w.glass ? '#8fa9bd' : '#2e3540');
    }
    if (w.graffiti && hash(i, 4) < .35 && 70 * s > 8) { ctx.fillStyle = '#c0392b'; ctx.font = `${70 * s}px "Black Han Sans", sans-serif`; ctx.fillText('철거', x - 60 * s, g - 120 * s); }
  }
}

function drawItems(z, s, g) {
  BANDS.forEach((b) => {
    const list = z.items[b.k]; if (!list || !list.length) return;
    const i0 = Math.floor(view.camX / b.cell) - 2, i1 = Math.floor((view.camX + W / s) / b.cell) + 1;
    if (i1 - i0 > 600) return;
    const salt = b.salt + z.salt * 13;
    for (let i = i0; i <= i1; i++) {
      if (hash(i, salt) > b.dens) continue;
      const it = ITEMS[list[Math.floor(hash(i, salt + 1) * list.length)]];
      if (Math.max(it.w, it.h) * s < 1.5) continue;
      const x = (i * b.cell + hash(i, salt + 2) * b.cell * .7 - view.camX) * s;
      if (x > W || x + it.w * s < 0) continue;
      it.d(x, g, s, hash(i, salt + 3));
    }
  });
}

function drawWeather(dt) {
  if (!view.weather) return;
  const rain = view.weather === 'rain';
  ctx.strokeStyle = 'rgba(200,215,230,.5)'; ctx.fillStyle = 'rgba(240,244,248,.85)'; ctx.lineWidth = 1;
  ctx.beginPath();
  particles.forEach((p) => {
    p.y += dt * p.v * (rain ? 1.6 : .12); if (p.y > 1) { p.y -= 1; p.x = Math.random(); }
    const x = p.x * W + (rain ? 0 : Math.sin(view.t + p.v * 9) * 8), y = p.y * H;
    if (rain) { ctx.moveTo(x, y); ctx.lineTo(x - 2, y + 14); } else ctx.rect(x, y, 2.2, 2.2);
  });
  rain ? ctx.stroke() : ctx.fill();
}

function drawTracker(sp, cx, g, s) {
  const [x0, y0, x1, y1] = sp.box, pad = 6;
  const L = cx + x0 * s - pad, T = g + y0 * s - pad, Rr = cx + x1 * s + pad, B = g + y1 * s + pad, k = Math.min(10, (Rr - L) / 3);
  ctx.strokeStyle = SODIUM; ctx.lineWidth = 1.5; ctx.beginPath();
  [[L, T, 1, 1], [Rr, T, -1, 1], [L, B, 1, -1], [Rr, B, -1, -1]].forEach(([x, y, dx, dy]) => { ctx.moveTo(x + dx * k, y); ctx.lineTo(x, y); ctx.lineTo(x, y + dy * k); });
  ctx.stroke();
  ctx.fillStyle = SODIUM; ctx.font = '500 11px "IBM Plex Mono", monospace'; ctx.fillText(`나 · ${sp.size}`, L, T - 6);
}

function draw(dt) {
  const sp = SPECIES[game.spKey] || null, z = ZONES[view.zone];
  const s = W / (sp ? sp.viewCm : 600), eye = sp ? sp.eye : 30;
  const g = clamp(H * .42 + eye * s, H * .45, H * .76);
  if (z.sky) {
    const gr = ctx.createLinearGradient(0, 0, 0, g);
    gr.addColorStop(0, view.night ? '#0b1226' : z.sky[0]); gr.addColorStop(1, view.night ? '#2b2c3c' : z.sky[1]);
    ctx.fillStyle = gr; ctx.fillRect(0, 0, W, g);
  } else R(0, 0, W, H, z.bg);
  drawFar(z, s, g);
  drawWall(z, s, g);
  if (z.ceiling) { const cy = g - z.ceiling * s; if (cy > 0) R(0, 0, W, cy, z.ceilColor); }
  R(0, g, W, H - g, z.ground);
  R(0, g, W, Math.max(2, Math.min(1.2 * s, 8)), view.weather === 'snow' ? '#e8ecef' : z.top);
  drawItems(z, s, g);
  if (view.night) {
    R(0, 0, W, H, 'rgba(6,10,28,.52)');
    const gx = W * .72, gy = Math.max(60, g - Math.min(H * .3, 600 * s)), rad = Math.min(W, H) * .45;
    const rg = ctx.createRadialGradient(gx, gy, 0, gx, gy, rad);
    rg.addColorStop(0, (view.glow || SODIUM) + '55'); rg.addColorStop(1, (view.glow || SODIUM) + '00');
    ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);
  }
  drawWeather(dt);
  if (sp) {
    const cx = W * .34, moving = view.speed > sp.speedCm * .3;
    ctx.save(); ctx.translate(cx, g); ctx.scale(s, s);
    ANIMALS[game.spKey](view.t, moving, sp.eye);
    ctx.restore();
    drawTracker(sp, cx, g, s);
    updateScaleBar(s);
  }
  if (view.fade > 0) R(0, 0, W, H, `rgba(5,7,8,${view.fade})`);
}

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, .05); last = now; view.t += dt;
  const sp = SPECIES[game.spKey];
  const cruise = sp ? sp.speedCm : 60;
  const target = game.phase === 'move' ? cruise : cruise * .05;
  view.speed += (target - view.speed) * Math.min(1, dt * 3);
  view.camX += view.speed * dt;
  view.fade = Math.max(0, view.fade - dt / FADE_S);
  draw(dt);
  requestAnimationFrame(frame);
}

/* ───────── 시작 (뷰어 업데이트 시 진행 상태 유지) ───────── */
window.claude?.hot?.snapshot?.(() => ({ game, zone: view.zone }));
function boot(data) {
  resize(); requestAnimationFrame(frame);
  const saved = data && data.game;
  if (!saved || !SPECIES[saved.spKey] || saved.phase === 'idle') { startRoulette(); return; }
  game = saved; updateHud();
  const sp = SPECIES[game.spKey];
  if (game.phase === 'birth') revealBirth(game.spKey);
  else if (game.phase === 'outcome') { setZone(data.zone || sp.birth.zone); showOutcome(); }
  else if (game.phase === 'end') { setZone(data.zone || sp.birth.zone); showEnd(); }
  else { const ev = sp.events[game.eventIdx]; setZone(ev.zone, ev); showChoice(); }
}
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
