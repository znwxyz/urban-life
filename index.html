<body>
<main class="app">
  <canvas id="stage" aria-hidden="true"></canvas>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div class="iris" id="iris" hidden aria-hidden="true"></div>
  <header class="hud" id="hud" hidden>
    <div class="tag who"><b id="spName"></b><small id="spLatin"></small><span id="age"></span></div>
    <div class="tag vitals">
      <div class="vrow" id="hpRow"><span data-i18n="hud.hp">체력</span><span class="seg hp" id="hpBar"></span><span class="num" id="hpNum"></span></div>
      <div class="vrow" id="foodRow"><span data-i18n="hud.food">포만</span><span class="seg food" id="foodBar"></span><span class="num" id="foodNum"></span></div>
      <div class="kids" id="kids"></div>
    </div>
    <div class="scale"><i id="scaleBar"></i><span id="scaleLabel"></span></div>
  </header>
  <!-- 홈 화면 종이 조각이 옛날 브라운관처럼 픽셀 단위로 미세하게 떨리는 필터. 노이즈 씨앗을 main.js가 계속 바꾼다 -->
  <svg class="fx-defs" width="0" height="0" aria-hidden="true" focusable="false">
    <filter id="tvJitter" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence id="tvJitterNoise" type="fractalNoise" baseFrequency="0.85" numOctaves="1" seed="1" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.2" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>
  <!-- 표지: 처음 들어올 때 한 번. 제목과 언어 고르기 -->
  <section class="cover" id="cover" hidden aria-labelledby="coverTitle">
    <h1 class="picker-title cover-title" id="coverTitle" lang="ko"><span class="kicker">도시의 바닥,</span><span class="tag main">누구로 살아볼래?</span></h1>
    <p class="cover-en" lang="en">Down on the city floor, who will you be?</p>
    <div class="cover-langs" role="group" aria-label="언어 / Language">
      <button class="cover-lang" type="button" data-lang="ko" lang="ko">한국어</button>
      <button class="cover-lang" type="button" data-lang="en" lang="en">English</button>
    </div>
  </section>
  <section class="picker" id="picker" hidden aria-labelledby="pickerTitle">
    <h1 class="picker-title" id="pickerTitle"><span class="kicker" data-i18n="title.kicker">도시의 바닥,</span><span class="tag main" data-i18n="title.main">누구로 살아볼래?</span></h1>
    <div class="pick-grid" id="pickGrid"></div>
    <p class="home-hint" data-i18n="home.hint">끝까지 살아남으면 기억 카드를 볼 수 있어요!</p>
    <div class="home-actions">
      <button class="wall-toggle" id="wallToggle" aria-expanded="false" aria-controls="wall" data-i18n="wall.open">방명록 모아보기 ▼</button>
      <button class="support-toggle" id="supportToggle" aria-expanded="false" aria-controls="support" hidden data-i18n="support.toggle">제작자 응원하기</button>
    </div>
    <div class="home-panels">
      <section class="support" id="support" hidden aria-label="제작자 응원하기" data-i18n-aria="support.toggle"></section>
      <section class="wall" id="wall" hidden aria-label="방명록 모아보기" data-i18n-aria="wall.open"></section>
    </div>
    <nav class="lang-pick" aria-label="언어 / Language">
      <button class="direct-toggle" id="langToggle" type="button"></button>
    </nav>
    <nav class="album-pick" aria-label="수집한 기억카드" data-i18n-aria="album.title">
      <button class="direct-toggle" id="albumToggle" type="button" aria-controls="album" data-i18n="album.toggle">수집한 기억카드 보기</button>
    </nav>
    <nav class="direct-pick" aria-label="캐릭터 직접 고르기" data-i18n-aria="direct.toggle">
      <ul class="direct-list" id="directList" hidden></ul>
      <button class="direct-toggle" id="directToggle" aria-expanded="false" aria-controls="directList">캐릭터 직접 고르기 ▴</button>
    </nav>
  </section>
  <section class="album" id="album" hidden role="dialog" aria-modal="true" aria-labelledby="albumTitle">
    <header class="album-head">
      <h2 id="albumTitle" data-i18n="album.title">수집한 기억카드</h2>
      <span class="album-count" id="albumCount"></span>
      <button class="memory-close" id="albumClose" type="button" data-i18n="close">닫기 ✕</button>
    </header>
    <ol class="album-stack" id="albumStack"></ol>
    <p class="album-empty" id="albumEmpty" hidden data-i18n-html="album.empty">아직 모은 기억카드가 없어요.<br>끝까지 살아남으면 한 장씩 모여요.</p>
  </section>
  <div class="memory" id="memory" hidden role="dialog" aria-modal="true" aria-label="따뜻했던 기억" data-i18n-aria="memory.dialog">
    <figure class="memory-frame">
      <img id="memoryImg" alt="" decoding="async">
      <p class="memory-fail" id="memoryFail" hidden data-i18n="memory.fail">그림을 불러오지 못했어요.</p>
      <button class="memory-close" id="memoryClose" type="button" data-i18n="close">닫기 ✕</button>
    </figure>
  </div>
  <div class="caption" id="caption" hidden><span class="tc" id="capTc"></span><span class="tx" id="capTx"></span></div>
  <section class="deck" id="deck" hidden aria-live="polite">
    <div class="note-wrap" id="noteWrap" hidden><div class="note-card" id="noteCard"></div></div>
    <div class="card-wrap" id="cardWrap">
      <div class="card">
        <div class="hint l" id="hintL"></div><div class="hint r" id="hintR"></div>
        <div class="hint u" id="hintU"></div><div class="hint d" id="hintD"></div>
        <div class="card-body" id="cardBody"></div>
      </div>
    </div>
    <div class="picks" id="picks"></div>
  </section>
  <div class="fx-layer" id="fxLayer" aria-hidden="true"></div>
</main>
