<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>도시에서 태어나기</title>
<meta name="description" content="도시의 동물로 랜덤하게 태어나, 주택가와 도심과 공원 사이에서 끝까지 살아남는 선택형 게임.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
<link rel="stylesheet" href="css/style.css?v=202610072222">
</head>
<body>
<main class="app">
  <canvas id="stage" aria-hidden="true"></canvas>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div class="iris" id="iris" hidden aria-hidden="true"></div>
  <header class="hud" id="hud" hidden>
    <div class="tag who"><b id="spName"></b><small id="spLatin"></small><span id="age"></span></div>
    <div class="tag vitals">
      <div class="vrow" id="hpRow"><span>체력</span><span class="seg hp" id="hpBar"></span><span class="num" id="hpNum"></span></div>
      <div class="vrow" id="foodRow"><span>포만</span><span class="seg food" id="foodBar"></span><span class="num" id="foodNum"></span></div>
      <div class="kids" id="kids"></div>
    </div>
    <div class="scale"><i id="scaleBar"></i><span id="scaleLabel"></span></div>
  </header>
  <section class="picker" id="picker" hidden aria-labelledby="pickerTitle">
    <h1 class="picker-title" id="pickerTitle"><span class="kicker">도시의 바닥,</span><span class="tag main">누구로 살아볼래?</span></h1>
    <div class="pick-grid" id="pickGrid"></div>
    <div class="home-actions">
      <button class="wall-toggle" id="wallToggle" aria-expanded="false" aria-controls="wall">방명록 모아보기 ▼</button>
      <button class="support-toggle" id="supportToggle" aria-expanded="false" aria-controls="support" hidden>제작자 응원하기</button>
    </div>
    <section class="support" id="support" hidden aria-label="제작자 응원하기"></section>
    <section class="wall" id="wall" hidden aria-label="방명록 모아보기"></section>
  </section>
  <div class="caption" id="caption" hidden><span class="tc" id="capTc"></span><span class="tx" id="capTx"></span></div>
  <section class="deck" id="deck" hidden aria-live="polite">
    <div class="note-wrap" id="noteWrap" hidden><div class="note-card" id="noteCard"></div></div>
    <div class="card-wrap" id="cardWrap">
      <div class="card">
        <div class="hint l" id="hintL"></div><div class="hint r" id="hintR"></div>
        <div class="hint u" id="hintU"></div><div class="hint d" id="hintD"></div>
        <div class="card-body" id="cardBody"></div>
      </div>
    </div>
    <div class="picks" id="picks"></div>
  </section>
  <div class="fx-layer" id="fxLayer" aria-hidden="true"></div>
</main>

<script src="js/core/color.js?v=202610072222"></script>
<script src="js/core/engine.js?v=202610072222"></script>
<script src="js/core/note.js?v=202610072222"></script>
<script src="js/data/scenes.js?v=202610072222"></script>
<script src="js/data/cast.js?v=202610072222"></script>
<script src="js/data/registry.js?v=202610072222"></script>
<script src="js/data/species/cat.js?v=202610072222"></script>
<script src="js/data/species/cockroach.js?v=202610072222"></script>
<script src="js/data/species/pigeon.js?v=202610072222"></script>
<script src="js/data/species/fly.js?v=202610072222"></script>
<script src="js/render/paper.js?v=202610072222"></script>
<script src="js/render/items-outdoor.js?v=202610072222"></script>
<script src="js/render/items-indoor.js?v=202610072222"></script>
<script src="js/render/animals.js?v=202610072222"></script>
<script src="js/render/actors-people.js?v=202610072222"></script>
<script src="js/render/actors-animals.js?v=202610072222"></script>
<script src="js/render/art/cat.js?v=202610072222"></script>
<script src="js/render/art/cockroach.js?v=202610072222"></script>
<script src="js/render/art/pigeon.js?v=202610072222"></script>
<script src="js/render/art/fly.js?v=202610072222"></script>
<script src="js/render/backdrop.js?v=202610072222"></script>
<script src="js/render/scene.js?v=202610072222"></script>
<script src="js/render/blood.js?v=202610072222"></script>
<script src="js/ui.js?v=202610072222"></script>
<script src="js/fx.js?v=202610072222"></script>
<script src="js/config.js?v=202610072222"></script>
<script src="js/guestbook.js?v=202610072222"></script>
<script src="js/main.js?v=202610072222"></script>
</body>
</html>
